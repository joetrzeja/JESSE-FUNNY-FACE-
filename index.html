<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jesse Funny Face</title>

  <!-- MediaPipe Face Mesh & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video { display: none; }
    
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* Top App Header & Branding Bar */
    #top-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 30;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      padding: 12px 16px 16px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #FFD700;
      font-size: 20px;
      font-weight: 800;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      letter-spacing: 0.5px;
    }

    #app-thumbnail {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #FFD700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
      border: 2px solid #FFF;
    }

    /* Action Controls Bar */
    #action-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .action-btn {
      background: rgba(20, 20, 20, 0.75);
      color: white;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    .action-btn:active { transform: scale(0.95); }

    #rec-btn.recording {
      background: rgba(220, 20, 60, 0.9);
      border-color: #FF0055;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(255, 0, 85, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
    }

    /* Active Filter Title Label */
    #filter-label {
      position: absolute;
      bottom: calc(115px + env(safe-area-inset-bottom, 15px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(0, 0, 0, 0.85);
      color: #FFF;
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      pointer-events: none;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,215,0,0.4);
      white-space: nowrap;
    }

    /* Bottom Filter Carousel */
    #filter-bar {
      position: absolute;
      bottom: calc(25px + env(safe-area-inset-bottom, 15px));
      left: 0; right: 0;
      z-index: 20;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 10px 16px 15px 16px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    #filter-bar::-webkit-scrollbar { display: none; }
    
    .filter-btn {
      flex: 0 0 auto;
      width: 60px; height: 60px;
      border-radius: 50%;
      background: rgba(30, 30, 30, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.35);
      color: white;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 0.15s, border-color 0.15s;
    }
    .filter-btn.active {
      border-color: #FFD700;
      background: rgba(255, 215, 0, 0.4);
      transform: scale(1.15);
    }
  </style>
</head>
<body>

  <div id="app-container">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="output_canvas"></canvas>

    <!-- Top Header -->
    <div id="top-header">
      <div id="brand-title">
        <div id="app-thumbnail">🤪</div>
        <span>Jesse Funny Face</span>
      </div>
      <div id="action-bar">
        <button class="action-btn" id="photo-btn" onclick="takePhoto()">📸 Photo</button>
        <button class="action-btn" id="rec-btn" onclick="toggleRecording()">🎥 Record</button>
        <button class="action-btn" id="sound-btn" onclick="toggleSound()">🔊 Sound ON</button>
      </div>
    </div>

    <div id="filter-label">1. TikTok Old Grandpa</div>
    <div id="filter-bar"></div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const filterBar = document.getElementById('filter-bar');
    const filterLabel = document.getElementById('filter-label');

    let currentFilterIndex = 0;
    let soundEnabled = true;
    let lastMouthSoundTime = 0;

    // --- Web Audio Synthesizer ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime;

      switch(type) {
        case 'boing':
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(650, now + 0.3);
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.3);
          break;

        case 'zap':
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(900, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.2);
          break;

        case 'quack':
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.linearRampToValueAtTime(240, now + 0.15);
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.2);
          break;

        case 'squeak':
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1100, now);
          osc.frequency.linearRampToValueAtTime(1700, now + 0.12);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.12);
          break;

        case 'honk':
          osc.type = 'square';
          osc.frequency.setValueAtTime(220, now);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.25);
          break;

        case 'pop':
          osc.type = 'sine';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
          gain.gain.setValueAtTime(0.6, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.08);
          break;

        case 'fart':
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(110, now);
          osc.frequency.linearRampToValueAtTime(60, now + 0.35);
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.35);
          break;
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('sound-btn');
      btn.innerText = soundEnabled ? "🔊 Sound ON" : "🔇 Sound OFF";
    }

    // --- Helper to build SVG Overlay Images ---
    function makeImage(svgString) {
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
      return img;
    }

    // Realistic Graphical Mask Assets
    const ASSETS = {
      // 1. Old Grandpa (Full realistic gray beard, mustache & forehead wrinkles)
      oldGrandpa: makeImage(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
          <!-- Forehead Wrinkles -->
          <path d="M 120 70 Q 200 50 280 70 M 130 90 Q 200 70 270 90 M 140 110 Q 200 95 260 110" stroke="#7A5230" stroke-width="4" fill="none" opacity="0.65" stroke-linecap="round"/>
          <!-- Bushy White Eyebrows -->
          <path d="M 100 120 Q 140 95 180 125" stroke="#E6E6E6" stroke-width="16" stroke-linecap="round" fill="none"/>
          <path d="M 220 125 Q 260 95 300 120" stroke="#E6E6E6" stroke-width="16" stroke-linecap="round" fill="none"/>
          <!-- Full Gray Beard & Handlebar Mustache -->
          <path d="M 90 220 C 70 340, 140 390, 200 390 C 260 390, 330 340, 310 220 C 280 260, 250 280, 200 280 C 150 280, 120 260, 90 220 Z" fill="#D9D9D9" opacity="0.95"/>
          <path d="M 110 230 Q 200 270 200 240 Q 200 270 290 230 Q 200 290 110 230 Z" fill="#FFFFFF"/>
        </svg>
      `),

      // 2. Old Grandma (Pearl glasses, curly white hair cut-out & rosy cheek blush)
      oldGrandma: makeImage(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
          <!-- Curly White Hair Top -->
          <circle cx="120" cy="70" r="45" fill="#EEEEEE"/>
          <circle cx="200" cy="50" r="50" fill="#F5F5F5"/>
          <circle cx="280" cy="70" r="45" fill="#EEEEEE"/>
          <!-- Round Glasses -->
          <circle cx="140" cy="160" r="45" stroke="#B8860B" stroke-width="8" fill="rgba(255,255,255,0.2)"/>
          <circle cx="260" cy="160" r="45" stroke="#B8860B" stroke-width="8" fill="rgba(255,255,255,0.2)"/>
          <line x1="185" y1="160" x2="215" y2="160" stroke="#B8860B" stroke-width="8"/>
          <!-- Rosy Cheeks -->
          <circle cx="110" cy="220" r="25" fill="#FF69B4" opacity="0.4"/>
          <circle cx="290" cy="220" r="25" fill="#FF69B4" opacity="0.4"/>
        </svg>
      `),

      // 3. Shocked Face (Huge wide open mouth cut-out & bulging anime eyes)
      shockedFace: makeImage(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
          <!-- Bulging Eyes -->
          <circle cx="120" cy="130" r="55" fill="#FFF" stroke="#000" stroke-width="6"/>
          <circle cx="120" cy="130" r="18" fill="#000"/>
          <circle cx="280" cy="130" r="55" fill="#FFF" stroke="#000" stroke-width="6"/>
          <circle cx="280" cy="130" r="18" fill="#000"/>
          <!-- Huge Wide Open Mouth -->
          <ellipse cx="200" cy="270" rx="65" ry="85" fill="#3D0000" stroke="#000" stroke-width="6"/>
          <path d="M 160 310 Q 200 270 240 310 Q 200 355 160 310 Z" fill="#FF4D4D"/>
        </svg>
      `),

      // 4. Big Toothy Smile (Glossy red lips with bright white teeth overlay)
      toothySmile: makeImage(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
          <!-- Glossy Lips -->
          <path d="M 30 100 Q 120 40 200 70 Q 280 40 370 100 Q 280 170 200 150 Q 120 170 30 100 Z" fill="#D60036" stroke="#8B0000" stroke-width="6"/>
          <!-- Big Teeth -->
          <path d="M 60 95 Q 200 75 340 95 L 330 115 Q 200 135 70 115 Z" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
          <line x1="200" y1="80" x2="200" y2="125" stroke="#CCC" stroke-width="3"/>
          <line x1="150" y1="85" x2="150" y2="120" stroke="#CCC" stroke-width="2"/>
          <line x1="250" y1="85" x2="250" y2="120" stroke="#CCC" stroke-width="2"/>
        </svg>
      `),

      // 5. Crying Tears (Streams of flowing blue water tears)
      cryingTears: makeImage(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
          <!-- Left Eye Tear Stream -->
          <path d="M 120 120 C 100 180, 140 240, 110 320 C 90 370, 130 380, 120 320 Z" fill="#00BFFF" opacity="0.8"/>
          <!-- Right Eye Tear Stream -->
          <path d="M 280 120 C 260 180, 300 240, 270 320 C 250 370, 290 380, 280 320 Z" fill="#00BFFF" opacity="0.8"/>
          <circle cx="120" cy="350" r="14" fill="#00BFFF"/>
          <circle cx="280" cy="350" r="14" fill="#00BFFF"/>
        </svg>
      `),

      // 6. Gigachad Jaw (Chiseled realistic jawline cut-out + dark sunglasses)
      gigachad: makeImage(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
          <!-- Dark Aviator Glasses -->
          <path d="M 70 130 L 190 130 L 175 190 L 85 190 Z" fill="#111" stroke="#DAA520" stroke-width="5"/>
          <path d="M 210 130 L 330 130 L 315 190 L 225 190 Z" fill="#111" stroke="#DAA520" stroke-width="5"/>
          <line x1="185" y1="140" x2="215" y2="140" stroke="#DAA520" stroke-width="6"/>
          <!-- Chiseled Stubble Jaw -->
          <path d="M 60 200 L 100 320 L 200 370 L 300 320 L 340 200" stroke="#3A2E2B" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.65"/>
        </svg>
      `),

      // 7. Venetian Masquerade Mask
      masquerade: makeImage(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
          <path d="M 20 100 C 40 20, 170 30, 200 80 C 230 30, 360 20, 380 100 C 340 170, 230 150, 200 110 C 170 150, 60 170, 20 100 Z" fill="#1A1A1A" stroke="#FFD700" stroke-width="8"/>
          <!-- Eye Cutouts -->
          <ellipse cx="110" cy="95" rx="35" ry="22" fill="#000" stroke="#FFD700" stroke-width="3"/>
          <ellipse cx="290" cy="95" rx="35" ry="22" fill="#000" stroke="#FFD700" stroke-width="3"/>
        </svg>
      `),

      // 8. Zombie Rott (Rotting zombie skin patches & dark eyes)
      zombie: makeImage(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
          <circle cx="120" cy="140" r="45" fill="#1C2E12" opacity="0.75"/>
          <circle cx="280" cy="140" r="45" fill="#1C2E12" opacity="0.75"/>
          <path d="M 130 250 L 270 270 M 150 280 L 250 240 M 180 230 L 220 300" stroke="#4C1111" stroke-width="6"/>
        </svg>
      `)
    };

    // --- 30 TikTok Featured & Realistic Human Face Filters ---
    const FILTER_LIST = [
      { id: 0,  icon: "👴", name: "1. TikTok Old Grandpa", sound: 'honk', type: 'mask', asset: ASSETS.oldGrandpa },
      { id: 1,  icon: "👵", name: "2. TikTok Old Grandma", sound: 'squeak', type: 'mask', asset: ASSETS.oldGrandma },
      { id: 2,  icon: "😲", name: "3. TikTok Mega Shocked", sound: 'zap', type: 'mask', asset: ASSETS.shockedFace },
      { id: 3,  icon: "😁", name: "4. Big Toothy Smile", sound: 'pop', type: 'mask', asset: ASSETS.toothySmile },
      { id: 4,  icon: "😭", name: "5. TikTok Funny Crying", sound: 'boing', type: 'mask', asset: ASSETS.cryingTears },
      { id: 5,  icon: "🗿", name: "6. Gigachad Jawline", sound: 'zap', type: 'mask', asset: ASSETS.gigachad },
      { id: 6,  icon: "🎭", name: "7. Masquerade Mask", sound: 'honk', type: 'mask', asset: ASSETS.masquerade },
      { id: 7,  icon: "🧟", name: "8. Zombie Craze", sound: 'fart', type: 'mask', asset: ASSETS.zombie },
      { id: 8,  icon: "🤪", name: "9. Circus Googly", sound: 'boing', type: 'custom' },
      { id: 9,  icon: "🕶️", name: "10. Thug Life", sound: 'pop', type: 'emoji', emoji: "🕶️" },
      { id: 10, icon: "🤓", name: "11. TikTok Nerd Face", sound: 'squeak', type: 'emoji', emoji: "🤓" },
      { id: 11, icon: "🤡", name: "12. Scary Clown", sound: 'honk', type: 'emoji', emoji: "🤡" },
      { id: 12, icon: "🐶", name: "13. Happy Doggo", sound: 'boing', type: 'emoji', emoji: "🐶" },
      { id: 13, icon: "🐱", name: "14. Kitty Cat", sound: 'squeak', type: 'emoji', emoji: "🐱" },
      { id: 14, icon: "🐽", name: "15. Pig Snout", sound: 'fart', type: 'emoji', emoji: "🐽" },
      { id: 15, icon: "🦄", name: "16. Magic Unicorn", sound: 'squeak', type: 'emoji', emoji: "🦄" },
      { id: 16, icon: "👽", name: "17. Alien Cyclops", sound: 'zap', type: 'emoji', emoji: "👽" },
      { id: 17, icon: "😈", name: "18. Little Devil", sound: 'zap', type: 'emoji', emoji: "😈" },
      { id: 18, icon: "😇", name: "19. Holy Angel", sound: 'squeak', type: 'emoji', emoji: "😇" },
      { id: 19, icon: "🏴‍☠️", name: "20. Pirate Cap'n", sound: 'zap', type: 'emoji', emoji: "🏴‍☠️" },
      { id: 20, icon: "🧛", name: "21. Vampire Fangs", sound: 'zap', type: 'emoji', emoji: "🧛" },
      { id: 21, icon: "🤖", name: "22. Cyborg Laser", sound: 'zap', type: 'emoji', emoji: "🤖" },
      { id: 22, icon: "🧙", name: "23. Grand Wizard", sound: 'boing', type: 'emoji', emoji: "🧙" },
      { id: 23, icon: "👑", name: "24. Royal King", sound: 'honk', type: 'emoji', emoji: "👑" },
      { id: 24, icon: "💀", name: "25. Skull Mask", sound: 'zap', type: 'emoji', emoji: "💀" },
      { id: 25, icon: "🦆", name: "26. Quack Duck", sound: 'quack', type: 'emoji', emoji: "🦆" },
      { id: 26, icon: "🤩", name: "27. Anime Star", sound: 'pop', type: 'emoji', emoji: "🤩" },
      { id: 27, icon: "🔥", name: "28. Fire Eyes", sound: 'zap', type: 'emoji', emoji: "🔥" },
      { id: 28, icon: "🥷", name: "29. Shadow Ninja", sound: 'zap', type: 'emoji', emoji: "🥷" },
      { id: 29, icon: "🥳", name: "30. Disco Party", sound: 'pop', type: 'emoji', emoji: "🥳" }
    ];

    FILTER_LIST.forEach((f, idx) => {
      const btn = document.createElement('div');
      btn.className = `filter-btn ${idx === 0 ? 'active' : ''}`;
      btn.innerHTML = f.icon;
      btn.onclick = () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilterIndex = idx;
        filterLabel.innerText = f.name;
        playSound(f.sound);
      };
      filterBar.appendChild(btn);
    });

    function syncCanvasSize() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', syncCanvasSize);
    syncCanvasSize();

    // Photo Snapshot & Download
    function takePhoto() {
      playSound('pop');
      const dataUrl = canvasElement.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = `jesse_funny_face_${Date.now()}.png`;
      link.href = dataUrl;
      link.click();
    }

    // Video Recording
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    function toggleRecording() {
      const recBtn = document.getElementById('rec-btn');

      if (!isRecording) {
        recordedChunks = [];
        const canvasStream = canvasElement.captureStream(30);
        let mimeType = 'video/webm';
        if (MediaRecorder.isTypeSupported('video/mp4')) mimeType = 'video/mp4';

        mediaRecorder = new MediaRecorder(canvasStream, { mimeType });
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: mimeType });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = url;
          a.download = `jesse_funny_video_${Date.now()}.${mimeType.includes('mp4') ? 'mp4' : 'webm'}`;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 100);
        };

        mediaRecorder.start();
        isRecording = true;
        recBtn.classList.add('recording');
        recBtn.innerText = "🛑 Stop";
        playSound('boing');
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.classList.remove('recording');
        recBtn.innerText = "🎥 Record";
        playSound('pop');
      }
    }

    // Draw Realistic Image Mask Asset Overlay onto Face
    function drawGraphicMask(img, x, y, width, height, angle = 0) {
      canvasCtx.save();
      canvasCtx.translate(x, y);
      canvasCtx.rotate(angle);
      canvasCtx.drawImage(img, -width / 2, -height / 2, width, height);
      canvasCtx.restore();
    }

    // Standard Emoji Draw Routine
    function drawEmoji(emoji, x, y, size, angle = 0) {
      canvasCtx.save();
      canvasCtx.translate(x, y);
      canvasCtx.rotate(angle);
      canvasCtx.font = `${size}px sans-serif`;
      canvasCtx.textAlign = 'center';
      canvasCtx.textBaseline = 'middle';
      canvasCtx.fillText(emoji, 0, 0);
      canvasCtx.restore();
    }

    // --- MediaPipe Frame Process ---
    function onResults(results) {
      const w = canvasElement.width;
      const h = canvasElement.height;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, w, h);

      // Draw mirrored camera feed
      canvasCtx.translate(w, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, w, h);
      canvasCtx.restore();

      if (results.multiFaceLandmarks) {
        for (const landmarks of results.multiFaceLandmarks) {
          const getPt = (idx) => ({ x: (1 - landmarks[idx].x) * w, y: landmarks[idx].y * h });

          const nose = getPt(4);
          const lEye = getPt(159);
          const rEye = getPt(386);
          const mouth = getPt(14);
          const upperLip = getPt(13);
          const forehead = getPt(10);
          const chin = getPt(152);
          const underNose = getPt(164);

          // Right-side up Eye Angle Fix
          const screenLeftEye = lEye.x < rEye.x ? lEye : rEye;
          const screenRightEye = lEye.x < rEye.x ? rEye : lEye;

          const eyeDist = Math.hypot(screenRightEye.x - screenLeftEye.x, screenRightEye.y - screenLeftEye.y);
          const scale = Math.max(eyeDist / 70, 0.4);
          const angle = Math.atan2(screenRightEye.y - screenLeftEye.y, screenRightEye.x - screenLeftEye.x);

          // Mouth open trigger sound effect
          const mouthOpenDist = Math.hypot(mouth.x - upperLip.x, mouth.y - upperLip.y);
          if (mouthOpenDist > 22 * scale && Date.now() - lastMouthSoundTime > 600) {
            playSound(FILTER_LIST[currentFilterIndex].sound);
            lastMouthSoundTime = Date.now();
          }

          renderFilter(currentFilterIndex, { nose, lEye: screenLeftEye, rEye: screenRightEye, mouth, forehead, chin, underNose, scale, angle });
        }
      }
    }

    // Render Filter Selection
    function renderFilter(idx, f) {
      const filter = FILTER_LIST[idx];
      const s = f.scale;
      const a = f.angle;

      if (filter.type === 'mask') {
        // Draw realistic PNG graphical mask stretched over head
        const maskWidth = 260 * s;
        const maskHeight = 260 * s;
        drawGraphicMask(filter.asset, f.nose.x, f.nose.y, maskWidth, maskHeight, a);
      } else if (filter.type === 'custom') {
        // Googly eyes + clown nose
        drawGooglyEyes(f.lEye, f.rEye, 28 * s);
        drawEmoji("🔴", f.nose.x, f.nose.y, 45 * s, a);
      } else if (filter.type === 'emoji') {
        drawEmoji(filter.emoji, (f.lEye.x + f.rEye.x)/2, f.nose.y, 140 * s, a);
      }
    }

    function drawGooglyEyes(lEye, rEye, radius) {
      const t = Date.now() * 0.012;
      const pupilOffsetX = Math.sin(t) * (radius * 0.25);
      const pupilOffsetY = Math.cos(t * 1.3) * (radius * 0.25);

      [lEye, rEye].forEach(eye => {
        canvasCtx.beginPath();
        canvasCtx.arc(eye.x, eye.y, radius, 0, 2 * Math.PI);
        canvasCtx.fillStyle = '#FFFFFF'; canvasCtx.fill();
        canvasCtx.lineWidth = 3; canvasCtx.strokeStyle = '#000000'; canvasCtx.stroke();

        const px = eye.x + pupilOffsetX, py = eye.y + pupilOffsetY;
        canvasCtx.beginPath();
        canvasCtx.arc(px, py, radius * 0.4, 0, 2 * Math.PI);
        canvasCtx.fillStyle = '#000000'; canvasCtx.fill();

        canvasCtx.beginPath();
        canvasCtx.arc(px - radius * 0.1, py - radius * 0.1, radius * 0.1, 0, 2 * Math.PI);
        canvasCtx.fillStyle = '#FFFFFF'; canvasCtx.fill();
      });
    }

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 2,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({ image: videoElement });
      },
      width: 1280,
      height: 720,
      facingMode: 'user'
    });

    camera.start();
  </script>
</body>
</html>
