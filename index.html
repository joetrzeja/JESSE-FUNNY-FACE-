<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jesse Funny Face</title>

  <!-- MediaPipe Face Mesh CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body, html {
      margin: 0; padding: 0;
      width: 100vw; height: 100dvh;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #app-container {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    /* Video stream element (Kept in DOM to maintain mobile WebKit decoder) */
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.001;
      pointer-events: none;
      z-index: 1;
    }

    /* Fullscreen Main Display Canvas */
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
    }

    /* Header Bar */
    #top-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #brand-title {
      color: #FFD700;
      font-size: 18px;
      font-weight: 800;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #action-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
    }

    .action-btn {
      background: rgba(30, 30, 30, 0.85);
      color: #FFF;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(8px);
      cursor: pointer;
    }
    .action-btn:active { transform: scale(0.95); }

    /* Bottom Control Bar */
    #bottom-controls {
      position: absolute;
      bottom: calc(16px + env(safe-area-inset-bottom, 12px));
      left: 0; right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #filter-label {
      background: rgba(0, 0, 0, 0.8);
      color: #FFD700;
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(255, 215, 0, 0.4);
      backdrop-filter: blur(8px);
    }

    #filter-bar {
      width: 100%;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 6px 16px;
      -webkit-overflow-scrolling: touch;
    }
    #filter-bar::-webkit-scrollbar { display: none; }

    .filter-btn {
      flex: 0 0 auto;
      width: 54px; height: 54px;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.3);
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 0.15s, border-color 0.15s;
    }
    .filter-btn.active {
      border-color: #FFD700;
      background: rgba(255, 215, 0, 0.35);
      transform: scale(1.1);
    }

    /* Reticle Warning */
    #face-warning {
      position: absolute;
      top: 45%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      background: rgba(0,0,0,0.75);
      color: #FFD700;
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      pointer-events: none;
      border: 1px solid #FFD700;
      display: none;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="output_canvas"></canvas>
    <div id="face-warning">🎯 Position face in frame</div>

    <!-- UI Overlay Header -->
    <div id="top-header">
      <div id="brand-title">🤪 Jesse Funny Face</div>
      <div id="action-bar">
        <button class="action-btn" onclick="takePhoto()">📸 Photo</button>
        <button class="action-btn" onclick="switchCamera()">🔄 Flip Camera</button>
        <button class="action-btn" id="sound-btn" onclick="toggleSound()">🔊 Sound ON</button>
      </div>
    </div>

    <!-- UI Overlay Footer -->
    <div id="bottom-controls">
      <div id="filter-label">👴 1. Old Age Wrinkles</div>
      <div id="filter-bar"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');
    const filterBar = document.getElementById('filter-bar');
    const filterLabel = document.getElementById('filter-label');
    const faceWarning = document.getElementById('face-warning');

    let isFrontCamera = true;
    let activeFilterIndex = 0;
    let soundEnabled = true;
    let latestLandmarks = null;
    let isAIProcessing = false;
    let noFaceCounter = 0;

    // Filter List Definition
    const FILTERS = [
      { id: 0, icon: "👴", name: "1. Old Age Wrinkles", type: "aged" },
      { id: 1, icon: "🕶️", name: "2. Cool Sunglasses", type: "emoji", emoji: "🕶️", anchor: "eyes" },
      { id: 2, icon: "💄", name: "3. Glam Makeup", type: "makeup" },
      { id: 3, icon: "🗿", name: "4. Gigachad Jaw", type: "gigachad" },
      { id: 4, icon: "🧛", name: "5. Vampire Fangs", type: "vampire" },
      { id: 5, icon: "👑", name: "6. Royal Crown", type: "emoji", emoji: "👑", anchor: "head" },
      { id: 6, icon: "🤡", name: "7. Scary Clown", type: "emoji", emoji: "🤡", anchor: "face" },
      { id: 7, icon: "🤪", name: "8. Googly Eyes", type: "googly" },
      { id: 8, icon: "😈", name: "9. Devil Horns", type: "emoji", emoji: "😈", anchor: "head" },
      { id: 9, icon: "😇", name: "10. Angel Halo", type: "emoji", emoji: "😇", anchor: "head" },
      { id: 10, icon: "🔥", name: "11. Fire Eyes", type: "emoji", emoji: "🔥", anchor: "eyes" },
      { id: 11, icon: "🤖", name: "12. Cyber Mesh", type: "cyber" }
    ];

    // Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playPopSound() {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-btn').innerText = soundEnabled ? "🔊 Sound ON" : "🔇 Sound OFF";
    }

    // Render Filter Buttons
    function initFilterUI() {
      filterBar.innerHTML = '';
      FILTERS.forEach((f) => {
        const btn = document.createElement('div');
        btn.className = `filter-btn ${f.id === activeFilterIndex ? 'active' : ''}`;
        btn.innerHTML = f.icon;
        btn.onclick = () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeFilterIndex = f.id;
          filterLabel.innerText = `${f.icon} ${f.name}`;
          playPopSound();
        };
        filterBar.appendChild(btn);
      });
    }
    initFilterUI();

    // Canvas Resize Sync
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Camera Stream Controller
    async function startCamera() {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: isFrontCamera ? 'user' : 'environment',
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        alert("Camera error: " + err.message);
      }
    }

    async function switchCamera() {
      isFrontCamera = !isFrontCamera;
      playPopSound();
      await startCamera();
    }

    // Capture & Share Photo
    function takePhoto() {
      playPopSound();
      canvas.toBlob(async (blob) => {
        const file = new File([blob], `jesse_funny_face_${Date.now()}.png`, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: 'Jesse Funny Face' });
          } catch (e) {}
        } else {
          const a = document.createElement('a');
          a.download = file.name;
          a.href = URL.createObjectURL(blob);
          a.click();
        }
      });
    }

    // --- MAIN 60 FPS RENDER LOOP ---
    function renderFrame() {
      requestAnimationFrame(renderFrame);

      if (video.readyState < 2) return;

      const W = canvas.width;
      const H = canvas.height;
      const vW = video.videoWidth || 640;
      const vH = video.videoHeight || 480;

      // Calculate exact Object-Fit Cover math
      const scale = Math.max(W / vW, H / vH);
      const renderW = vW * scale;
      const renderH = vH * scale;
      const offsetX = (W - renderW) / 2;
      const offsetY = (H - renderH) / 2;

      ctx.clearRect(0, 0, W, H);

      // Draw Video Feed (Centred & Mirrored correctly)
      ctx.save();
      if (isFrontCamera) {
        ctx.translate(W, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, (W - renderW) / 2, offsetY, renderW, renderH);
      } else {
        ctx.drawImage(video, offsetX, offsetY, renderW, renderH);
      }
      ctx.restore();

      // Render AR Filter Layer if Face Landmarks Exist
      if (latestLandmarks) {
        // Map raw normalized points to exact canvas pixel coordinates
        const pts = latestLandmarks.map(lm => {
          const rawX = offsetX + lm.x * renderW;
          const screenX = isFrontCamera ? (W - rawX) : rawX;
          const screenY = offsetY + lm.y * renderH;
          return { x: screenX, y: screenY };
        });

        drawFilter(pts);
      }
    }

    // Filter Drawing Logic
    function drawFilter(pts) {
      const f = FILTERS.find(item => item.id === activeFilterIndex) || FILTERS[0];

      const nose = pts[4];
      const lEye = pts[159];
      const rEye = pts[386];
      const forehead = pts[10];

      // Calculate scale & angle from eyes
      const eyeDist = Math.hypot(rEye.x - lEye.x, rEye.y - lEye.y);
      const scale = Math.max(eyeDist / 60, 0.4);
      const angle = Math.atan2(rEye.y - lEye.y, rEye.x - lEye.x);

      switch(f.type) {
        case 'emoji':
          let anchorX = nose.x;
          let anchorY = nose.y;
          if (f.anchor === 'head') {
            anchorX = forehead.x;
            anchorY = forehead.y - 35 * scale;
          } else if (f.anchor === 'eyes') {
            anchorX = (lEye.x + rEye.x) / 2;
            anchorY = (lEye.y + rEye.y) / 2;
          }
          drawEmoji(f.emoji, anchorX, anchorY, 130 * scale, angle);
          break;

        case 'aged':
          ctx.save();
          ctx.strokeStyle = 'rgba(75, 45, 20, 0.75)';
          ctx.lineWidth = 3 * scale;
          ctx.lineCap = 'round';
          // Forehead lines
          drawPath(pts, [109, 10, 338]); ctx.stroke();
          drawPath(pts, [67, 151, 297]); ctx.stroke();
          // Eyebrows
          ctx.strokeStyle = 'rgba(240, 240, 240, 0.9)';
          ctx.lineWidth = 14 * scale;
          drawPath(pts, [70, 63, 105, 66, 107]); ctx.stroke();
          drawPath(pts, [300, 293, 334, 296, 336]); ctx.stroke();
          ctx.restore();
          break;

        case 'makeup':
          ctx.save();
          ctx.fillStyle = 'rgba(210, 20, 60, 0.8)';
          drawPath(pts, [61, 185, 40, 39, 37, 0, 267, 269, 270, 409, 291, 146], true);
          ctx.fill();
          ctx.restore();
          break;

        case 'gigachad':
          ctx.save();
          ctx.strokeStyle = '#221100';
          ctx.lineWidth = 12 * scale;
          drawPath(pts, [172, 136, 150, 149, 176, 148, 152, 377, 400, 378, 379, 365, 397]);
          ctx.stroke();
          ctx.restore();
          break;

        case 'vampire':
          if (!pts[37] || !pts[267]) return;
          ctx.save();
          ctx.fillStyle = '#FFF';
          [pts[37], pts[267]].forEach(pt => {
            ctx.beginPath();
            ctx.moveTo(pt.x - 6 * scale, pt.y);
            ctx.lineTo(pt.x + 6 * scale, pt.y);
            ctx.lineTo(pt.x, pt.y + 24 * scale);
            ctx.closePath();
            ctx.fill();
          });
          ctx.restore();
          break;

        case 'googly':
          [lEye, rEye].forEach(eye => {
            ctx.save();
            ctx.beginPath();
            ctx.arc(eye.x, eye.y, 25 * scale, 0, 2 * Math.PI);
            ctx.fillStyle = '#FFF'; ctx.fill();
            ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath();
            ctx.arc(eye.x + Math.sin(Date.now() * 0.01) * 6, eye.y, 10 * scale, 0, 2 * Math.PI);
            ctx.fillStyle = '#000'; ctx.fill();
            ctx.restore();
          });
          break;

        case 'cyber':
          ctx.save();
          ctx.strokeStyle = '#00FFFF';
          ctx.lineWidth = 1.5;
          drawPath(pts, [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 152, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109], true);
          ctx.stroke();
          ctx.restore();
          break;
      }
    }

    function drawPath(pts, indices, isClosed = false) {
      ctx.beginPath();
      indices.forEach((idx, i) => {
        const p = pts[idx];
        if (p) {
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
      });
      if (isClosed) ctx.closePath();
    }

    function drawEmoji(emoji, x, y, size, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.font = `${size}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, 0, 0);
      ctx.restore();
    }

    // --- BACKGROUND NON-BLOCKING AI LOOP ---
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        latestLandmarks = results.multiFaceLandmarks[0].landmark;
        noFaceCounter = 0;
        faceWarning.style.display = 'none';
      } else {
        noFaceCounter++;
        if (noFaceCounter > 15) {
          latestLandmarks = null;
          faceWarning.style.display = 'block';
        }
      }
    });

    async function processAIFrames() {
      if (video.readyState >= 2 && !isAIProcessing) {
        isAIProcessing = true;
        try {
          await faceMesh.send({ image: video });
        } catch (e) {}
        isAIProcessing = false;
      }
      setTimeout(processAIFrames, 30);
    }

    // App Startup
    (async function init() {
      await startCamera();
      requestAnimationFrame(renderFrame);
      processAIFrames();
    })();
  </script>
</body>
</html>
